name: Evidence and WordPress bridge checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Node and Python entry points
        run: npm run check
      - name: Test source audits, imports, reports and installation
        run: npm test
      - name: Lint and exercise WordPress bridge contracts
        run: python3 -B tests/wordpress/run.py
      - name: Build the WordPress upload package
        run: python3 -B bin/build-wordpress.py --output ./dist/ewebcity-seo-bridge.zip
      - name: Verify npm package contents
        run: npm pack --dry-run
